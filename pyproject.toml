[project]
name = "kiralrc"
version = "0.2.0"
description = "给歌曲生成逐字 LRC：SOFA 歌声对齐 + faster-whisper + demucs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "av>=12",
    "torch>=2.0",
    "torchaudio>=2.0",
    "faster-whisper>=1.1",
    "demucs>=4.0",
    "transformers>=4.40",
    "pypinyin>=0.49",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.scripts]
kiralrc = "kiralrc.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kiralrc"]
