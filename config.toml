[paths]
# 所有路径都相对项目根目录；也可用环境变量覆盖（见 kiralrc/config.py）

# 中文歌声对齐模型（SOFA 官方 ckpt）
sofa_ckpt = "models/sofa/v1.0.0_mandarin_singing.ckpt"
# SOFA 源码（third_party 下，已去 .git）
sofa_root = "third_party/SOFA"
# SOFA 的拼音词典
sofa_dict = "third_party/SOFA/dictionary/opencpop-extension.txt"
# faster-whisper CT2 模型
whisper_model = "models/faster-whisper-large-v3"
# FireRedASR-AED-L 中文专精 ASR 模型（无歌词听写兜底）
firered_model = "models/FireRedASR-AED-L"
# 中间产物
work_dir = "work"

[defaults]
# 时间戳格式：3 = 三位小数（全库统一），2 = 两位
decimals = 3
# 逐字时间提前量（秒，正数=提前）
lead = 0.0
# demucs 分离的采样率
sep_sample_rate = 44100
# 抓歌词的间隔（秒），避免 405
lyric_interval = 4.5
# KI-1: 主唱检测阈值（人声轨 1~4kHz 能量占比与 P90 RMS）
min_vocal_ratio = 0.08
min_vocal_rms = 0.008
# KI-2: 剪辑版音频单行最低匹配覆盖率（低于此值视为该段被剪掉并剔除）
min_line_coverage = 0.22
# KI-3: 非中文长音按人声能量包络做时长保真
restore_long_vowel = true
# KI-5: 多音字自定义读音词表（相对项目根）
polyphone_file = "polyphone.toml"
# KI-7: 英文/数字逐字粒度："word"（按词）或 "char"（按字母均分）
en_granularity = "word"
# 可选：Apple Music 官方歌词源（留空则静默跳过，也可用 KIRALRC_APPLE_MEDIA_USER_TOKEN 覆盖）
apple_media_user_token = ""
apple_storefront = "jp"
